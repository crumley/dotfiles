# tmux configuration
#
# Installed to ~/.config/tmux/tmux.conf. tmux 3.1+ reads that path; 3.2+ also
# honours $XDG_CONFIG_HOME/tmux/tmux.conf. Nothing below hardcodes a package
# prefix or a platform, so the same file works on macOS and Linux.
#
# Reload after editing: prefix + r


# --- shell --------------------------------------------------------------------

# Use fish when it is installed, wherever it happens to live (/opt/homebrew/bin,
# /usr/local/bin, /usr/bin, ~/.nix-profile/bin ...). If fish is not installed the
# option is left untouched and tmux keeps using the login shell, which is the
# right thing to fall back to.
run-shell 'fish_path=$(command -v fish 2>/dev/null) && tmux set-option -g default-shell "$fish_path"; true'


# --- terminal -----------------------------------------------------------------

# tmux-256color is the correct terminfo entry for tmux itself and is what gives
# italics inside tmux. Only set it if the system actually has the entry -- an
# unknown default-terminal stops tmux from starting sessions at all.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"'

# 24-bit colour passthrough for the terminals this runs under (Ghostty reports
# TERM=xterm-ghostty, most others *-256color).
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# Don't swallow ESC waiting for an escape sequence -- this is the classic
# "vim feels laggy inside tmux" fix, and it keeps the M-arrow bindings snappy.
set -sg escape-time 10

# Let programs (vim, fzf) know when the terminal gains or loses focus.
set -g focus-events on

# Modified-key reporting: fixes Enter and other extended keys, and "makes pi
# happy". extended-keys is tmux 3.2+, extended-keys-format is 3.5+. Ask tmux
# whether it knows each option instead of comparing version strings, so an older
# tmux quietly skips the line rather than printing an error on every start.
if-shell 'tmux show-options -g extended-keys >/dev/null 2>&1' 'set -g extended-keys on'
if-shell 'tmux show-options -g extended-keys-format >/dev/null 2>&1' 'set -g extended-keys-format csi-u'


# --- behaviour ----------------------------------------------------------------

set -g mouse on
set -g history-limit 50000

# don't rename windows automatically
set-option -g allow-rename off

# 1-based numbering (matches the key you reach for), kept contiguous when a
# window closes. Delete these three lines to go back to tmux's 0-based default.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g pane-border-format "#{pane_index} #{pane_title}"
set -g pane-border-status top


# --- clipboard ----------------------------------------------------------------

# Let tmux and the programs inside it drive the outer clipboard over OSC 52.
# This is the part that works unchanged over ssh, and Ghostty supports it.
set -g set-clipboard on

# Also pipe copy-mode selections to a native clipboard tool when one exists:
# pbcopy on macOS, wl-copy under Wayland, xclip/xsel under X11. tmux 3.2+ routes
# the default copy bindings through copy-command, so this needs no key bindings;
# the option is skipped on older tmux instead of erroring.
run-shell 'tmux show-options -g copy-command >/dev/null 2>&1 || exit 0; \
	for c in "pbcopy" "wl-copy" "xclip -selection clipboard -in" "xsel --clipboard --input"; do \
		command -v "${c%% *}" >/dev/null 2>&1 || continue; \
		tmux set-option -g copy-command "$c"; \
		break; \
	done; true'


# --- bindings -----------------------------------------------------------------

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# new windows and splits inherit current pane's working directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
