# Atuin — shell history. https://docs.atuin.sh/configuration/config/
#
# Only settings that differ from Atuin's defaults live here. The full annotated
# default is what Atuin writes when this file is missing; run
# `atuin default-config` (or peek at a fresh install) to see every option.
#
# Paths are deliberately not set: Atuin's own defaults are already XDG-correct
# and identical in shape on macOS and Linux (~/.local/share/atuin/...), so
# pinning them here would only be a way to get them wrong on one platform.
#
# Installer note: Atuin writes this file if and only if it does not exist, and
# never overwrites or replaces an existing one — a plain file, a symlink, or a
# stow-folded directory all survive untouched. The stow conflict is purely a
# race in the *gap*: delete the file, and any shell that starts before stow runs
# recreates it. See install.sh for how the takeover closes that gap.

## date format used, either "us" or "uk"
dialect = "us"

## how the search box matches what you type: prefix | fulltext | fuzzy | skim
search_mode = "fuzzy"

## search every host and directory by default, not just this session
## (cycle through the narrower modes with ctrl-r while the search box is open)
filter_mode = "global"
