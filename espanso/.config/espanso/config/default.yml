# espanso global config. https://espanso.org/docs/configuration/basics/
#
# Only the settings that differ from espanso's defaults are here; the file used
# to be mostly upstream's commented-out template. `espanso path` says where
# espanso is reading this from, and `espanso match list` parses this config plus
# match/ and prints every trigger it found — the quickest syntax check there is.

# No double-tap toggle. The default is ALT, which fires by accident often
# enough to be worse than having no toggle at all. Use `espanso cmd toggle`
# (or `espanso stop`) when espanso genuinely needs to be out of the way.
toggle_key: OFF

# No built-in search overlay hotkey either; same reasoning.
search_shortcut: off

# Reload on file change, so editing a match file in the repo takes effect
# without restarting the daemon.
auto_restart: true
